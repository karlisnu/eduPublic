name: Validate EDU-EduMatch

on:
  pull_request:
  push:
    branches: [main, karla-branch]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4.3
        env:
          MYSQL_DATABASE: appdb
          MYSQL_USER: dev
          MYSQL_PASSWORD: dev
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u dev -pdev --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate runtime versions
        run: |
          node --version
          npm --version
          test "$(node --version | cut -d. -f1)" = "v22"

      - name: Validate frontend package
        working-directory: frontend
        run: npm install --ignore-scripts

      - name: Validate setup script
        run: bash -n .devcontainer/setup.sh

      - name: Validate Dev Container JSON
        run: node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json', 'utf8'))"

      - name: Validate MySQL connectivity
        env:
          MYSQL_PWD: dev
        run: mysql --protocol=tcp -h 127.0.0.1 -u dev appdb -e "SELECT 1;"

      - name: Validate required project files
        run: |
          test -f .devcontainer/devcontainer.json
          test -f .devcontainer/docker-compose.yml
          test -f .github/pull_request_template.md
          test -f .github/ISSUE_TEMPLATE/project_proposal.md
          test -f docs/pair-log.md
          test -f docs/architecture.md
          test -f docs/week1-verification.md