name: Validate EduMatch

on:
  pull_request:
  push:
    branches: [main, karla-branch]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit root, backend, and frontend dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix frontend audit --audit-level=high

  backend:
    name: Backend tests and MySQL integration
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4.3
        env:
          MYSQL_DATABASE: appdb
          MYSQL_USER: dev
          MYSQL_PASSWORD: dev
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u dev -pdev --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: appdb
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Detect disabled or bypassed checks
        run: node backend/scripts/check-ci-bypasses.js
      - name: Apply database migrations
        run: npm --prefix backend run db:migrate
      - name: Run backend tests with coverage and minimum test count
        run: npm --prefix backend run test:ci
      - name: Start backend and verify MySQL-backed health endpoint
        run: npm --prefix backend run ci:smoke

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
