<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Tutorías</title>
    <link rel="stylesheet" href="Inicio.css">
</head>

<body>
    <div class="login-container">
       
        <div class="login-image">
            <img src="../../imagenescosas/jacob-bentzinger-QiLPQeQSXD0-unsplash.jpg" alt="Estudiante leyendo">
        </div>

        
        <div class="login-form-section">
            <div class="form-content">

                
                <div class="main-group">
                    <h1>INICIO DE <br> SESIÓN</h1>

                    <p class="question">¿A que vienes?</p>
                    <div class="role-selection">
                        
                        <button type="button" class="role-btn active" id="btn-estudiante">Estudiante</button>
                        <button type="button" class="role-btn" id="btn-admin">Admin</button>
                    </div>

                   
                    <form id="loginForm">
                        <div class="input-group">
                            <label>Nombre de usuario</label>
                            
                            <input type="text" id="username" class="dark-input" required>
                        </div>

                        <div class="input-group">
                            <label>Contraseña</label>
                            
                            <input type="password" id="password" class="dark-input" required>
                            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                        </div>
                       

                        
                        <button type="submit" class="btn-main-login">LOG IN</button>
                    </form>
                </div>

                
                <div class="footer-login">
                    <img src="../../imagenes/logo.jpg" alt="Logo Tutorías" class="mini-logo">
                    <p>TUTORÍAS <br> UNIVERSITARIAS</p>
                   
                    <a href="#" class="terms">Términos y condiciones de servicio</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.role-btn');
            const loginForm = document.getElementById('loginForm');
            const btnAdmin = document.getElementById('btn-admin');
            const userInput = document.getElementById('username');
            const passInput = document.getElementById('password');

            
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });

            
            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const apiBase = window.location.protocol === "file:" || window.location.port !== "8000"
                    ? "http://localhost:8000"
                    : "";
                const endpoint = `${apiBase}/api/login`;

                try {
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username: userInput.value, password: passInput.value })
                    });
                    const user = await response.json();
                    if (!response.ok) throw new Error(user.error || "No se pudo iniciar sesión");

                    if (btnAdmin.classList.contains('active') && user.role !== "admin") {
                        throw new Error("Selecciona el acceso que corresponde a tu usuario");
                    }
                    if (!btnAdmin.classList.contains('active') && user.role !== "alumno") {
                        throw new Error("Selecciona el acceso que corresponde a tu usuario");
                    }

                    sessionStorage.setItem("edumatchUser", JSON.stringify(user));
                    window.location.href = user.role === "admin" ? "DashboardAdmin.html" : "DashboardAlumnos.html";
                } catch (error) {
                    alert(error.message);
                }
            });
        });
    </script>
</body>

</html>
