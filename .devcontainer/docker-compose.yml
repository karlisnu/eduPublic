services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    depends_on:
      db:
        condition: service_healthy

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # The default Compose network lets the app reach MySQL at hostname db.

  db:
    image: mysql:8.4.3
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u dev -pdev --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
